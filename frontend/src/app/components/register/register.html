<div class="register-container">
  <div class="register-card">
    <h1>🎓 Student Registration</h1>
    <h2>Registro de Estudiante</h2>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
      <div class="form-row">
        <div class="form-group">
          <label for="nombre">Nombre *</label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            [(ngModel)]="registerData.nombre"
            required
            placeholder="Tu nombre"
          />
        </div>

        <div class="form-group">
          <label for="apellido">Apellido *</label>
          <input
            type="text"
            id="apellido"
            name="apellido"
            [(ngModel)]="registerData.apellido"
            required
            placeholder="Tu apellido"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="username">Usuario *</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="registerData.username"
          required
          placeholder="Nombre de usuario"
        />
      </div>

      <div class="form-group">
        <label for="email">Email *</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="registerData.email"
          required
          placeholder="tu@email.com"
        />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password">Contraseña *</label>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="registerData.password"
            required
            placeholder="Mínimo 6 caracteres, mayúscula, minúscula y número"
          />
          <small class="hint">Mínimo 6 caracteres, 1 mayúscula, 1 minúscula, 1 número</small>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar Contraseña *</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            [(ngModel)]="registerData.confirmPassword"
            required
            placeholder="Repite tu contraseña"
          />
        </div>
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        [disabled]="loading || !registerData.nombre || !registerData.apellido || !registerData.username || !registerData.email || !registerData.password"
        class="btn-primary"
      >
        <span *ngIf="!loading">Registrarse</span>
        <span *ngIf="loading">Registrando...</span>
      </button>
    </form>

    <div class="login-link">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión aquí</a>
    </div>
  </div>
</div>
